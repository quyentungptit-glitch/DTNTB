services:
  api:
    build:
      context: .
      dockerfile: DTNTB.API/Dockerfile
    env_file:
      - ./.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Asia/Ho_Chi_Minh
      Firebase__ServiceAccountPath: /run/secrets/firebase-service-account.json
    volumes:
      - ${SECRETS_DIR:-/opt/dtntb/secrets}:/run/secrets:ro
      - dtntb_dataprotection_keys:/home/app/.aspnet/DataProtection-Keys
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ../DTNTB-Frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped

volumes:
  dtntb_dataprotection_keys:
